[package]
name = "senso"
version = "0.1.0"
edition = "2021"
description = "Point-of-sale and back office for Senso Bar: orders, receipts, menu, recipes, stock, shopping and prep."

# No external crates: the app builds offline with only the Rust standard library.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
