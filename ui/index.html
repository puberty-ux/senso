<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A1714">
<title>Senso Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Lalezar&family=Vazirmatn:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Senso Bar: the shop's black chalk menu boards, mustard stools and drink colours.
   Layout: icon rail | menu tiles grouped by category | paper order ticket. Phones get a bottom bar and the ticket as a sheet. */
:root{
  --board:#1A1714; --surface:#24201B; --raised:#2F2A24; --line:#3B352E;
  --chalk:#F2ECE2; --muted:#A79E91; --faint:#7C7469;
  --stool:#F2B632; --stool-ink:#1C1608; --stool-soft:#4A3B17;
  --paper:#FBF7EE; --paper-ink:#24211C; --paper-line:#D8D0C1;
  --ok:#86CF98; --ok-soft:#1F3426; --warn:#F2B35E; --warn-soft:#3E2E16; --bad:#F38A79; --bad-soft:#41221C; --info:#93BCE6; --info-soft:#1C2B3B;
  --plate:#3A332B; --halo:22%;
  --f-fa:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --f-head:'Bricolage Grotesque','Vazirmatn',system-ui,sans-serif;
  --f-body:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --f-ticket:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --rail:92px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --board:#E7E2DA; --surface:#FFFFFF; --raised:#F3F0EB; --line:#D9D3C9;
  --chalk:#1F1B17; --muted:#6A6258; --faint:#8E8578;
  --stool:#E0A015; --stool-ink:#1C1608; --stool-soft:#F7E3B0;
  --paper:#FFFDF8; --paper-ink:#24211C; --paper-line:#DDD5C6;
  --ok:#2F7D4A; --ok-soft:#DCEFE1; --warn:#9A5A0A; --warn-soft:#F7E6C9; --bad:#B23B2C; --bad-soft:#F6DCD6; --info:#2D5C8A; --info-soft:#DCE7F2;
  --plate:#E3DCD1; --halo:28%; color-scheme:light }}
:root[data-theme="light"]{
  --board:#E7E2DA; --surface:#FFFFFF; --raised:#F3F0EB; --line:#D9D3C9;
  --chalk:#1F1B17; --muted:#6A6258; --faint:#8E8578;
  --stool:#E0A015; --stool-ink:#1C1608; --stool-soft:#F7E3B0;
  --paper:#FFFDF8; --paper-ink:#24211C; --paper-line:#DDD5C6;
  --ok:#2F7D4A; --ok-soft:#DCEFE1; --warn:#9A5A0A; --warn-soft:#F7E6C9; --bad:#B23B2C; --bad-soft:#F6DCD6; --info:#2D5C8A; --info-soft:#DCE7F2;
  --plate:#E3DCD1; --halo:28%; color-scheme:light }

*{box-sizing:border-box}
html{background:var(--board)}
body{margin:0;background:var(--board);color:var(--chalk);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--stool);outline-offset:2px}
[hidden]{display:none!important}
.fa{font-family:var(--f-fa);font-weight:400;direction:rtl}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-family:var(--f-head);font-weight:700;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:28px;font-weight:800}
h2{font-size:21px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}

/* rail / bottom bar */
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 8px 16px max(8px,env(safe-area-inset-left,0px));z-index:30}
.mark{width:52px;height:52px;border-radius:16px;background:var(--stool);color:var(--stool-ink);display:grid;place-items:center;margin-bottom:14px;font-family:var(--f-fa);font-size:26px;line-height:1;padding-top:6px}
.nav{display:flex;flex-direction:column;gap:4px;width:100%}
.nv{border:0;background:transparent;border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--muted);position:relative}
.nv svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{color:var(--chalk);background:var(--raised)}
.nv[aria-current="page"]{color:var(--chalk);background:var(--raised)}
.nv[aria-current="page"] svg{stroke:var(--stool)}
.nv .badge{position:absolute;top:4px;right:14px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.rail .spacer{flex:1}
.rail-btn{border:1px solid var(--line);background:transparent;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.rail-btn:hover{color:var(--chalk)}
.rail-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.conn{width:10px;height:10px;border-radius:50%;background:var(--ok);margin-top:6px}
.conn.off{background:var(--bad)}

.app{margin-left:var(--rail);min-height:100vh}
.page{padding:28px max(28px,env(safe-area-inset-right,0px)) 48px 28px;max-width:1500px}

@media (max-width:860px){
  .rail{inset:auto 0 0 0;width:auto;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);
    padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .mark,.rail .spacer,.rail-btn,.conn{display:none}
  .nav{flex-direction:row}
  .nv{flex:1;font-size:11px;padding:7px 2px 5px}
  .nv .badge{right:calc(50% - 22px)}
  .app{margin-left:0}
  .page{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(160px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .mobile-top{display:flex!important}
}
.mobile-top{display:none;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.mobile-top .mark{width:38px;height:38px;border-radius:11px;font-size:19px;margin:0;display:grid;padding-top:4px}
.mobile-top b{font-family:var(--f-head);font-size:18px}
.mobile-top .rail-btn{display:grid;margin-left:auto;width:40px;height:40px}

/* common */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head .sub{color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none;color:var(--chalk)}
.btn:hover{border-color:var(--faint)}
.btn.go{background:var(--stool);border-color:var(--stool);color:var(--stool-ink)}
.btn.go:hover{filter:brightness(1.06)}
.btn.quiet{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.pill{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.6}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.mute{background:var(--raised);color:var(--muted)}
input:not([type=checkbox]):not([type=color]),select,textarea{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--stool)}
label.f{display:grid;gap:5px;font-size:13.5px;font-weight:500;color:var(--muted)}
label.ck{display:flex;gap:10px;align-items:center;font-size:14.5px}
label.ck input{width:20px;height:20px;accent-color:var(--stool)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.empty{padding:32px 18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--chalk);font-family:var(--f-head);font-size:17px;margin-bottom:4px}
.note{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--info-soft);margin-bottom:18px;font-size:14.5px}
.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}
.note p{flex:1;min-width:220px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;white-space:nowrap;display:flex;align-items:center;gap:7px;font-size:14.5px;color:var(--muted)}
.chip:hover{color:var(--chalk)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--faint))}
.chip[aria-pressed="true"]{background:var(--chalk);color:var(--board);border-color:var(--chalk)}

/* SELL */
.sell{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
@media (max-width:1100px){.sell{grid-template-columns:minmax(0,1fr) 320px}}
@media (max-width:860px){.sell{grid-template-columns:minmax(0,1fr)}.sell>.ticket-col{display:none}}
.sell-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.sell-top .find{flex:1;min-width:200px;max-width:340px;position:relative}
.sell-top .find input{padding-left:38px;background:var(--surface)}
.sell-top .find svg{position:absolute;left:12px;top:50%;translate:0 -50%;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.today{color:var(--muted);font-size:14.5px}
.today b{color:var(--chalk);font-weight:600}
.band{margin-top:26px}
.band-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.band-h .fa{font-size:26px;line-height:1.2;color:var(--chalk)}
.band-h span{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.tile{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:0 0 12px;display:flex;flex-direction:column;text-align:right;overflow:hidden;transition:transform .1s ease,border-color .15s}
.tile:hover{border-color:color-mix(in oklab,var(--c) 60%,var(--line))}
.tile:active{transform:scale(.97)}
.art{height:104px;display:grid;place-items:center;background:radial-gradient(circle at 50% 62%,color-mix(in oklab,var(--c) var(--halo),transparent) 0 46%,transparent 47%)}
.art svg{width:76px;height:76px;overflow:visible}
.tile .tfa{font-family:var(--f-fa);font-size:19px;line-height:1.3;padding:2px 14px 0;direction:rtl}
.tile .ten{font-size:13px;color:var(--muted);padding:0 14px;text-align:left;line-height:1.35}
.tile .tfoot{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 14px 0;margin-top:auto;direction:ltr;flex-wrap:wrap}
.tile .price{font-family:var(--f-head);font-weight:700;font-size:17px}
.tile .price small{font-weight:500;color:var(--muted);font-size:13px;margin-left:2px}
.tile .qty{position:absolute;top:10px;left:10px;min-width:30px;height:30px;border-radius:15px;background:var(--stool);color:var(--stool-ink);font-weight:700;display:grid;place-items:center;padding:0 9px;font-size:15px;animation:pop .18s ease-out}
.tile.in{border-color:var(--stool);box-shadow:inset 0 0 0 1px var(--stool)}
.tile.off{opacity:.55}
@keyframes pop{from{transform:scale(.6)}}

/* the order ticket */
.ticket-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px)}
.ticket{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:22px 20px 26px;position:relative;
  --zig:radial-gradient(circle at 8px 0,#0000 7px,#000 7.5px);
  -webkit-mask:var(--zig) top/16px 51% repeat-x,radial-gradient(circle at 8px 100%,#0000 7px,#000 7.5px) bottom/16px 51% repeat-x;
  mask:var(--zig) top/16px 51% repeat-x,radial-gradient(circle at 8px 100%,#0000 7px,#000 7.5px) bottom/16px 51% repeat-x;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.28))}
.ticket .tk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:12px;border-bottom:1.5px dashed var(--paper-line)}
.ticket .tk-h h2{font-size:20px}
.ticket .tk-h span{font-family:var(--f-ticket);font-size:13px;opacity:.7}
.ticket .tk-lines{max-height:min(42vh,420px);overflow-y:auto;margin:4px -6px 0;padding:0 6px}
.tl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--paper-line)}
.tl .n{min-width:0}
.tl .n b{display:block;font-family:var(--f-fa);font-weight:400;font-size:17px;direction:rtl;text-align:right;line-height:1.35}
.tl .n small{opacity:.65;font-size:12.5px}
.tl .amt{font-family:var(--f-ticket);font-size:14px;text-align:right;align-self:end}
.step{display:flex;align-items:center;border:1px solid var(--paper-line);border-radius:10px;height:34px;width:max-content}
.step button{border:0;background:transparent;width:34px;height:32px;font-size:18px;color:inherit;line-height:1}
.step span{min-width:22px;text-align:center;font-family:var(--f-ticket);font-weight:600}
.ticket .fields input{background:#fff;border-color:var(--paper-line);color:var(--paper-ink);min-height:40px;padding:8px 10px}
.ticket label.f{color:color-mix(in oklab,var(--paper-ink) 65%,transparent);font-size:12.5px}
.ticket .fields{display:grid;gap:8px;margin-top:14px}
.tk-tot{margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--paper-line);display:grid;gap:3px;font-family:var(--f-ticket);font-size:13.5px}
.tk-tot div{display:flex;justify-content:space-between}
.tk-tot .grand{font-family:var(--f-head);font-size:24px;font-weight:800;margin-top:4px}
.charge{width:100%;margin-top:14px;min-height:54px;border-radius:14px;border:0;background:var(--paper-ink);color:var(--paper);font-weight:700;font-size:17px;display:flex;justify-content:center;align-items:center;gap:10px}
.charge:disabled{opacity:.35;cursor:not-allowed}
.charge .num{color:var(--stool)}
.ticket .clear{display:block;margin:10px auto 0;border:0;background:transparent;color:inherit;opacity:.6;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.ticket .clear.armed{opacity:1;color:#B23B2C;text-decoration:none;font-weight:600}
.ticket .blank{padding:28px 6px;text-align:center;opacity:.7}
.ticket .blank b{display:block;font-family:var(--f-head);font-size:17px;opacity:1}

#orderbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
#orderbar button{width:100%;border:0;border-radius:16px;background:var(--paper);color:var(--paper-ink);padding:12px 14px 12px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-weight:600}
#orderbar .go{margin-left:auto;background:var(--paper-ink);color:var(--paper);border-radius:11px;padding:8px 14px}
@media (min-width:861px){#orderbar{display:none!important}}

/* ORDERS */
.summary{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 22px}
.summary div{display:grid}
.summary b{font-family:var(--f-head);font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.summary span{color:var(--muted);font-size:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
.hours{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;align-items:end;height:130px;margin-top:12px}
.hours div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.hours i{display:block;width:100%;max-width:26px;background:var(--stool);border-radius:5px 5px 2px 2px;min-height:2px}
.hours i.zero{background:var(--line)}
.hours small{font-size:11px;color:var(--muted)}
.best{display:grid;gap:10px;margin-top:10px}
.best .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:14.5px}
.best .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.best .bar i{display:block;height:100%;border-radius:4px}
.olist{display:grid;margin-top:6px}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:12px 6px}
.orow:hover{background:var(--raised)}
.orow .no{width:46px;height:46px;border-radius:13px;background:var(--raised);display:grid;place-items:center;font-family:var(--f-head);font-weight:700}
.orow .what{min-width:0}
.orow .what div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .what small{color:var(--muted)}
.orow .tot{font-family:var(--f-head);font-weight:700;font-variant-numeric:tabular-nums}
.orow.void{opacity:.5}.orow.void .tot{text-decoration:line-through}

/* lists (menu, stock, shopping) */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mi{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:12px 16px}
.mi:first-child{border-top:0}
.mi:hover{background:var(--raised)}
.mi .sw{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in oklab,var(--c) var(--halo),transparent);grid-row:span 2}
.mi .sw svg{width:34px;height:34px;overflow:visible}
.mi .nm{min-width:0;display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.mi .nm .fa{font-size:18px}
.mi .nm small{color:var(--muted)}
.mi .pr{font-family:var(--f-head);font-weight:700;text-align:right}
.mi .meta{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.mi.off{opacity:.55}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 16px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.sr:first-child{border-top:0}
.sr .nm b{display:block;font-weight:600}
.sr .nm small{color:var(--muted)}
.sr .q{text-align:right;min-width:96px}
.sr .q b{font-family:var(--f-head);font-size:19px;font-variant-numeric:tabular-nums}
.sr .q small{color:var(--muted);margin-left:4px}
.sr .acts{display:flex;gap:6px;align-items:center}
.gauge{grid-column:1/-1;height:6px;border-radius:3px;background:var(--raised);position:relative;overflow:hidden}
.gauge i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--ok)}
.gauge.low i{background:var(--warn)}.gauge.out i{background:var(--bad)}
.gauge u{position:absolute;top:0;bottom:0;width:2px;background:var(--chalk);opacity:.35}
.sstep{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;height:36px}
.sstep button{border:0;background:transparent;width:34px;height:34px;font-size:18px;color:var(--chalk)}
.sstep span{font-size:12px;color:var(--muted);min-width:30px;text-align:center}
@media (max-width:640px){.sr{grid-template-columns:minmax(0,1fr) auto}.sr .acts{grid-column:1/-1;justify-content:space-between}}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input{max-width:320px;background:var(--surface)}
.lr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.lr:first-child{border-top:0}
.lr input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok)}
.lr .t small{display:block;color:var(--muted)}
.lr.done .t span{text-decoration:line-through;color:var(--muted)}
.low{display:grid;grid-template-columns:minmax(0,1fr) 96px auto;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.low:first-child{border-top:0}
.low input{text-align:right;min-height:38px;padding:6px 10px}
.low .b{display:flex;gap:6px}
@media (max-width:560px){.low{grid-template-columns:minmax(0,1fr) 88px}.low .b{grid-column:1/-1}}
.add{display:grid;grid-template-columns:minmax(0,1fr) 100px auto;gap:8px;margin-bottom:12px}
@media (max-width:560px){.add{grid-template-columns:minmax(0,1fr) 84px}.add .btn{grid-column:1/-1}}
.x{border:0;background:var(--raised);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--muted);flex:none}
.x:hover{color:var(--chalk)}
table.need{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:12px}
table.need th{text-align:left;font-weight:500;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px}
table.need td{padding:9px 8px;border-bottom:1px solid var(--line)}
table.need .n{text-align:right;font-variant-numeric:tabular-nums}
table.need tr.short td{background:var(--bad-soft)}
.scroll-x{overflow-x:auto}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card h3{margin-bottom:4px}
.card .hint{color:var(--muted);font-size:14px;margin-bottom:12px}

/* sheets */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(8,6,4,.6);display:flex;align-items:center;justify-content:center;padding:24px}
@media (max-width:700px){#sheet{align-items:flex-end;padding:calc(env(safe-area-inset-top,0px) + 24px) 0 0}}
.sheet{background:var(--surface);border:1px solid var(--line);width:100%;max-width:560px;max-height:100%;overflow-y:auto;border-radius:22px;padding:22px;display:grid;gap:14px;animation:rise .2s ease-out}
.sheet.paper{background:var(--board)}
@media (max-width:700px){.sheet{border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}}
@keyframes rise{from{transform:translateY(14px);opacity:.5}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.form{display:grid;gap:12px}
fieldset{border:1px solid var(--line);border-radius:14px;padding:12px;margin:0;display:grid;gap:8px}
legend{color:var(--muted);font-size:13.5px;padding:0 6px}
.rl{display:grid;grid-template-columns:minmax(0,1fr) 86px 42px 34px;gap:6px;align-items:center}
.rl input{text-align:right;padding:8px}
.rl select{padding:8px}
.rl span{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:150px}
.colorrow{display:flex;gap:10px;align-items:center}
.colorrow input[type=color]{width:48px;height:44px;border:1px solid var(--line);border-radius:11px;background:var(--raised);padding:4px}
.preview-r{background:var(--raised);border-radius:16px;padding:18px 10px;overflow-x:auto}
.rc{width:var(--pw,80mm);max-width:100%;margin:0 auto;background:var(--paper);color:var(--paper-ink);padding:14px 14px 16px;font:12.5px/1.45 var(--f-ticket);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.rc .fa{font-family:'Vazirmatn',Tahoma,sans-serif;font-weight:700;font-size:13px}
.rc .c{text-align:center}.rc .nm{font-family:var(--f-head);font-weight:800;font-size:19px;letter-spacing:.05em;text-transform:uppercase}
.rc .cut{border-top:1px dashed currentColor;opacity:.55;margin:8px 0}
.rc .row{display:flex;justify-content:space-between;gap:10px}
.rc .sm{font-size:11px;opacity:.8}
.rc .big{font-size:16px;font-weight:700}
.rc .void{text-align:center;font-weight:700;letter-spacing:.3em;border:2px solid currentColor;margin:6px 0}
.hint{color:var(--muted);font-size:13.5px}

#toast{position:fixed;left:50%;translate:-50% 0;bottom:28px;z-index:60;background:var(--chalk);color:var(--board);padding:11px 18px;border-radius:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 10px 28px rgba(0,0,0,.3)}
#toast.bad{background:var(--bad);color:#fff}
@media (max-width:860px){#toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}}
.down{max-width:520px;margin:12vh auto;text-align:center;display:grid;gap:14px;padding:0 16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside class="rail">
  <div class="mark" aria-hidden="true">س</div>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <div class="spacer"></div>
  <button class="rail-btn" data-act="theme" aria-label="Switch light or dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <button class="rail-btn" data-act="settings" aria-label="Shop and receipt settings" style="margin-top:6px"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  <span class="conn" id="conn" title="Connected"></span>
</aside>
<div class="app">
  <div class="mobile-top"><div class="mark" aria-hidden="true">س</div><b id="mname">Senso Bar</b>
    <button class="rail-btn" data-act="settings" aria-label="Shop and receipt settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button></div>
  <main class="page" id="main"></main>
</div>
<div id="orderbar" hidden><button data-act="openTicket"><span id="ob-n"></span><span class="num" id="ob-t"></span><span class="go">Review order</span></button></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
(() => {
'use strict';
const CATS=[['shakes','Shakes','شیک ها'],['mocktails','Mocktails','ماکتیل ها'],['energy','Energy drinks','مقوی ها'],['smoothies','Smoothies','اسموتی ها'],
  ['pancakes','Pancakes','پنکیک ها'],['waffles','Waffles','وافل ها'],['crepe','Crepe','کرپ'],['hot','Hot drinks','نوشیدنی گرم'],['tea','Tea and herbal','چای و دمنوش']]
  .map(([key,en,fa])=>({key,en,fa}));
const LOOK={shakes:'glass',smoothies:'glass',energy:'glass',mocktails:'tall',hot:'mug',tea:'mug',pancakes:'stack',waffles:'waffle',crepe:'crepe'};
const NAV=[
 ['sell','Sell','<path d="M4 8h16l-1.4 10.2a2 2 0 0 1-2 1.8H7.4a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>'],
 ['orders','Orders','<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'],
 ['menu','Menu','<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h4"/>'],
 ['stock','Stock','<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'],
 ['buy','Buy','<circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8a1.5 1.5 0 0 0 1.5-1.1L20 8H6.2"/>'],
 ['make','Make','<path d="M6 3v6a3 3 0 0 0 6 0V3M9 3v18M17 3c-1.7 0-3 2-3 5s1.3 4 3 4v9"/>']];

let D=null;
const S={tab:'sell',cat:'all',q:'',cart:[],order:{table:'',note:'',discount:''},day:null,dayCache:{},stockQ:'',stockF:'all',plan:[],sheet:null,edit:null,online:true};

/* helpers */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur=()=>D?.settings?.currency||'؋';
const n0=n=>Math.round(+n||0).toLocaleString('en-US');
const money=n=>`${n0(n)} ${cur()}`;
const qn=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const r3=n=>Math.round((+n||0)*1000)/1000;
const off=()=>D?.settings?.utc_offset_min??270;
const shop=at=>new Date((at+off()*60)*1000);
const hm=at=>{const d=shop(at);return `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`};
const dayShift=(k,n)=>{const[y,m,d]=k.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return t.toISOString().slice(0,10)};
const dayLabel=k=>{if(!D)return k;if(k===D.today)return 'Today';if(k===dayShift(D.today,-1))return 'Yesterday';const[y,m,d]=k.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})};
const longDate=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'})};
const step=u=>['kg','L'].includes(u)?0.5:['g','ml'].includes(u)?50:1;
const item=id=>D.menu.find(m=>m.id===id);
const ing=id=>D.ingredients.find(i=>i.id===id);
const catInfo=k=>CATS.find(c=>c.key===k)||{key:k,en:k,fa:''};
const catIdx=k=>{const i=CATS.findIndex(c=>c.key===k);return i<0?99:i};
const sortItems=a=>a.slice().sort((x,y)=>catIdx(x.cat)-catIdx(y.cat)||x.ord-y.ord||String(x.en).localeCompare(y.en));
const allCats=()=>{const k=new Set(CATS.map(c=>c.key));D.menu.forEach(m=>k.add(m.cat));return [...k].sort((a,b)=>catIdx(a)-catIdx(b)).map(catInfo)};
const catColor=k=>{const m=sortItems(D.menu.filter(x=>x.cat===k))[0];return m?m.color:'#A79E91'};
const state=i=>i.qty<=0?'out':i.qty<=i.min?'low':'ok';
const lowIngs=()=>D.ingredients.filter(i=>state(i)!=='ok');
const sortIngs=a=>a.slice().sort((x,y)=>x.name.localeCompare(y.name));
function canMake(m){if(!m.recipe.length)return null;let n=Infinity;for(const l of m.recipe){const i=ing(l.ing);if(!i)continue;n=Math.min(n,Math.floor(i.qty/l.qty+1e-9))}return n===Infinity?null:Math.max(0,n)}
const sugg=i=>{const s=step(i.unit);return Math.max(s,Math.ceil(r3(i.min*2-i.qty)/s)*s)};

/* drawings: one small picture per kind of item, tinted with the item's colour */
function art(m){const c=esc(m.color||'#C9A27E');const k=LOOK[m.cat]||'glass';
  const P={
   glass:`<path d="M41 2 35 21" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".55"/><path d="M17 18h30l-3.2 38.5a4 4 0 0 1-4 3.5H24.2a4 4 0 0 1-4-3.5z" fill="${c}"/><path d="M17 18h30l-.6 6.5H17.6z" fill="#fff" opacity=".6"/><path d="M23.5 29l1.6 23" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".35"/>`,
   tall:`<path d="M20 12h24l-2.6 45.5a3 3 0 0 1-3 2.5H25.6a3 3 0 0 1-3-2.5z" fill="${c}"/><rect x="25" y="20" width="7" height="7" rx="1.6" fill="#fff" opacity=".55" transform="rotate(-8 28 23)"/><rect x="33" y="29" width="7" height="7" rx="1.6" fill="#fff" opacity=".45" transform="rotate(10 36 32)"/><rect x="26" y="38" width="7" height="7" rx="1.6" fill="#fff" opacity=".4"/><circle cx="45" cy="12" r="8.5" fill="#F6D54A" stroke="#fff" stroke-width="1.6"/><path d="M45 4v16M37 12h16M39.3 6.3l11.4 11.4M50.7 6.3 39.3 17.7" stroke="#fff" stroke-width=".9" opacity=".75"/>`,
   mug:`<path d="M25 4c-3 4 3 6 0 10M33 4c-3 4 3 6 0 10" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".45"/><path d="M47 27h3.5a7 7 0 0 1 0 14H47" stroke="${c}" stroke-width="4.5" fill="none"/><path d="M12 20h36v24a12 12 0 0 1-12 12H24a12 12 0 0 1-12-12z" fill="${c}"/><ellipse cx="30" cy="20" rx="18" ry="3.4" fill="#fff" opacity=".4"/><path d="M6 61h48" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".3"/>`,
   stack:`<ellipse cx="32" cy="55" rx="28" ry="6" fill="var(--plate)"/><g fill="#D9984A"><rect x="9" y="41" width="46" height="10" rx="5"/><rect x="11" y="31" width="42" height="10" rx="5"/><rect x="13" y="21" width="38" height="10" rx="5"/></g><path d="M14 22c0-3.5 5-6 18-6s18 2.5 18 6c0 2-1.5 3.4-3 3.4s-1.4 6.6-3.4 6.6-2-4.6-3.6-4.6-1.2 3.2-3.2 3.2-2.2-3.3-4.2-3.3-2 5.4-4 5.4-2.3-6.4-4.3-6.4-2.8 2-4.3 2c-2 0-4-1.7-4-3.4z" fill="${c}"/><circle cx="32" cy="12" r="4.5" fill="#E2463F"/><path d="M32 7.6c.6-2 2-3 3.6-3.2" stroke="#6BA83A" stroke-width="2" fill="none" stroke-linecap="round"/>`,
   waffle:`<ellipse cx="32" cy="53" rx="28" ry="7" fill="var(--plate)"/><circle cx="32" cy="34" r="21" fill="#D9A15A"/><g stroke="#B27434" stroke-width="2.4" stroke-linecap="round"><path d="M22 17.5v33M32 13v42M42 17.5v33M15.5 24h33M11 34h42M15.5 44h33"/></g><circle cx="32" cy="34" r="21" fill="none" stroke="#C88A44" stroke-width="2.5"/><path d="M19 30c5-6 21-6 26 0-3 3-8 4-13 4s-10-1-13-4z" fill="${c}"/><circle cx="25" cy="41" r="4" fill="${c}"/><circle cx="40" cy="40" r="3.5" fill="#F4E04D"/>`,
   crepe:`<ellipse cx="32" cy="52" rx="28" ry="7" fill="var(--plate)"/><path d="M7 45 57 45 40 13z" fill="#E6B76E"/><path d="M7 45 40 13 31 45z" fill="#D19B52"/><path d="M15 39c6-3 9 2 15-1s9-7 15-9M21 31c5-2 8 2 13 0" stroke="${c}" stroke-width="3.2" fill="none" stroke-linecap="round"/><circle cx="47" cy="40" r="3.4" fill="#F1E3A2"/>`};
  return `<svg viewBox="0 0 64 64" aria-hidden="true">${P[k]}</svg>`}

/* server */
async function api(method,path,body){
  let r;
  try{r=await fetch(path,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined})}
  catch(_){setOnline(false);throw new Error("Can't reach the Senso app. Check it's still running on the shop computer.")}
  setOnline(true);
  let j={};try{j=await r.json()}catch(_){}
  if(!r.ok)throw new Error(j.error||`Something went wrong (${r.status}).`);
  if(j.state){D=j.state;S.dayCache={};render()}
  return j;
}
async function act(p,ok){try{const j=await p;if(ok)toast(ok);return j||{}}catch(e){toast(e.message,'bad');return null}}
function setOnline(v){if(S.online===v)return;S.online=v;const c=$('#conn');c.classList.toggle('off',!v);c.title=v?'Connected':'Not connected';if(!v)toast("Lost connection to the Senso app.",'bad')}
async function load(){
  try{const r=await fetch('/api/state');if(!r.ok)throw 0;D=await r.json();setOnline(true);render()}
  catch(_){setOnline(false);if(!D)$('#main').innerHTML=`<div class="down"><h1>Can't reach the Senso app</h1><p class="muted">Make sure the program is running on the shop computer, and that this device is on the same Wi-Fi.</p><div><button class="btn go" data-act="reload">Try again</button></div></div>`}
}
setInterval(async()=>{if(document.hidden||!D)return;try{const r=await fetch('/api/rev');const j=await r.json();setOnline(true);if(j.rev!==D.rev)load()}catch(_){setOnline(false)}},4000);

let tT;function toast(m,k){const t=$('#toast');t.textContent=m;t.className=k||'';t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,3000)}

/* render */
function render(){
  if(!D)return;
  const a=document.activeElement,aid=a&&a.id,sel=a&&typeof a.selectionStart==='number'?a.selectionStart:null;
  const low=lowIngs().length;
  $('#nav').innerHTML=NAV.map(([k,l,ic])=>`<button class="nv" data-act="tab" data-id="${k}" ${S.tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg>${l}${k==='buy'&&low?`<span class="badge">${low}</span>`:''}</button>`).join('');
  $('#mname').textContent=D.settings.name;document.title=D.settings.name;
  $('#main').innerHTML=(V[S.tab]||V.sell)();
  const n=S.cart.reduce((s,c)=>s+c.qty,0);
  $('#orderbar').hidden=!(S.tab==='sell'&&n);
  $('#ob-n').textContent=`${n} item${n===1?'':'s'}`;$('#ob-t').textContent=money(totals().total);
  if(S.sheet==='ticket'){if(!S.cart.length)closeSheet();else $('#sheet .sheet').innerHTML=`<div class="sh"><h2>Order</h2><button class="x" data-act="close" aria-label="Close">×</button></div>${ticket()}`}
  if(aid){const el=document.getElementById(aid);if(el&&el!==a){el.focus();if(sel!=null)try{el.setSelectionRange(sel,sel)}catch(_){}}}
}
const V={};
const empty=(t,b)=>`<div class="empty"><b>${t}</b>${b}</div>`;
const chip=(act,id,on,label,color)=>`<button class="chip" data-act="${act}" data-id="${esc(id)}" aria-pressed="${on}" ${color?`style="--c:${esc(color)}"`:''}>${color?'<i></i>':''}${label}</button>`;

/* SELL */
function totals(){const sub=S.cart.reduce((s,c)=>{const m=item(c.id);return s+(m?m.price*c.qty:0)},0);const d=Math.min(sub,Math.max(0,Math.round(+S.order.discount||0)));return{sub,disc:d,total:sub-d}}
function nextNo(){return D.orders.filter(o=>o.day===D.today).reduce((x,o)=>Math.max(x,o.no),0)+1}
function tile(m){const c=S.cart.find(x=>x.id===m.id);const cm=canMake(m);
  const flags=(cm===0?'<span class="pill bad">Out</span>':cm!==null&&cm<=5?`<span class="pill warn">${cm} left</span>`:'')+(m.verify?'<span class="pill info">Check</span>':'');
  return `<button class="tile${c?' in':''}${cm===0?' off':''}" style="--c:${esc(m.color)}" data-act="add" data-id="${esc(m.id)}" aria-label="${esc(m.en)}, ${money(m.price)}">
   ${c?`<span class="qty">${c.qty}</span>`:''}<span class="art">${art(m)}</span><span class="tfa" lang="fa">${esc(m.fa)}</span><span class="ten">${esc(m.en)}</span>
   <span class="tfoot"><span class="price">${n0(m.price)}<small>${esc(cur())}</small></span>${flags}</span></button>`}
function ticket(){
  if(!S.cart.length)return `<div class="blank"><b>No items yet</b>Tap a drink or dessert to start an order.</div>`;
  const t=totals();
  return `<div class="tk-lines">${S.cart.map(c=>{const m=item(c.id)||{fa:'?',en:'Removed item',price:0};return `<div class="tl">
    <div class="n"><b lang="fa">${esc(m.fa)}</b><small>${esc(m.en)}, ${n0(m.price)} each</small></div><span></span>
    <div class="step"><button data-act="dec" data-id="${esc(c.id)}" aria-label="One less ${esc(m.en)}">−</button><span>${c.qty}</span><button data-act="inc" data-id="${esc(c.id)}" aria-label="One more ${esc(m.en)}">+</button></div>
    <div class="amt">${n0(m.price*c.qty)}</div></div>`}).join('')}</div>
   <div class="fields"><div class="two"><label class="f">Table or name<input id="o-table" data-bind="table" value="${esc(S.order.table)}" placeholder="Table 4"></label>
   <label class="f">Discount<input id="o-disc" data-bind="discount" type="number" inputmode="numeric" min="0" step="5" value="${esc(S.order.discount)}" placeholder="0"></label></div>
   <label class="f">Note for the bar<input id="o-note" data-bind="note" value="${esc(S.order.note)}" placeholder="Less sugar, no ice"></label></div>
   <div class="tk-tot">${t.disc?`<div><span>Subtotal</span><span>${n0(t.sub)}</span></div><div><span>Discount</span><span>−${n0(t.disc)}</span></div>`:''}
   <div class="grand"><span>Total</span><span class="num">${money(t.total)}</span></div></div>
   <button class="charge" data-act="checkout">Complete order <span class="num">${money(t.total)}</span></button>
   <button class="clear" data-act="clearcart">Clear order</button>`}
V.sell=()=>{
  if(!D.menu.length)return `<div class="head"><h1>Sell</h1></div>`+empty('The menu is empty','Add drinks and desserts on the Menu tab first.');
  const live=D.orders.filter(o=>o.day===D.today&&o.status!=='void');
  const q=S.q.trim().toLowerCase();
  const act=D.menu.filter(m=>m.active&&(S.cat==='all'||m.cat===S.cat)&&(!q||m.en.toLowerCase().includes(q)||m.fa.includes(S.q.trim())));
  let body='';
  for(const c of allCats()){const its=sortItems(act.filter(m=>m.cat===c.key));if(!its.length)continue;
    body+=`<section class="band"><div class="band-h"><span class="fa" lang="fa">${esc(c.fa||c.en)}</span><span>${esc(c.en)}</span></div><div class="tiles">${its.map(tile).join('')}</div></section>`}
  if(!body)body=`<div style="margin-top:20px">${empty('Nothing matches',`No item is called “${esc(S.q)}”.`)}</div>`;
  const cats=allCats().filter(c=>D.menu.some(m=>m.active&&m.cat===c.key));
  return `<div class="sell"><div>
    <div class="head" style="margin-bottom:12px"><div><h1>${esc(longDate(D.today))}</h1><p class="today">Today so far: <b>${live.length} order${live.length===1?'':'s'}</b>, <b>${money(live.reduce((s,o)=>s+o.total,0))}</b></p></div></div>
    <div class="sell-top"><div class="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="find" data-bind="q" placeholder="Find an item" value="${esc(S.q)}" autocomplete="off"></div></div>
    <div class="chips">${chip('cat','all',S.cat==='all','Everything')}${cats.map(c=>chip('cat',c.key,S.cat===c.key,esc(c.en),catColor(c.key))).join('')}</div>
    ${body}</div>
    <div class="ticket-col"><div class="ticket"><div class="tk-h"><h2>New order</h2><span>#${nextNo()}</span></div>${ticket()}</div></div></div>`};

/* ORDERS */
V.orders=()=>{
  const day=S.day||D.today;
  const days=[...new Set([D.today,...D.days])].sort().reverse().slice(0,21);
  let list=D.orders.filter(o=>o.day===day);
  if(!list.length&&day!==D.today&&D.days.includes(day)){if(S.dayCache[day])list=S.dayCache[day];else{fetchDay(day);return `<div class="head"><h1>Orders</h1></div><p class="muted">Loading ${esc(dayLabel(day))}…</p>`}}
  const live=list.filter(o=>o.status!=='void');
  const rev=live.reduce((s,o)=>s+o.total,0);const sold=live.reduce((s,o)=>s+o.items.reduce((t,i)=>t+i.qty,0),0);
  const by={};live.forEach(o=>o.items.forEach(i=>{const k=i.id;by[k]=by[k]||{fa:i.fa,en:i.en,q:0,a:0,c:(item(i.id)||{}).color||'#A79E91'};by[k].q+=i.qty;by[k].a+=i.qty*i.price}));
  const top=Object.values(by).sort((a,b)=>b.q-a.q).slice(0,7);const mx=top[0]?.q||1;
  const hrs={};live.forEach(o=>{const h=shop(o.at).getUTCHours();hrs[h]=(hrs[h]||0)+o.total});
  const hk=Object.keys(hrs).map(Number);const h0=Math.min(9,...hk),h1=Math.max(22,...hk);const hmx=Math.max(1,...Object.values(hrs));
  const hours=[];for(let h=h0;h<=h1;h++)hours.push(h);
  return `<div class="head"><div><h1>Orders</h1><p class="sub">${esc(longDate(day))}</p></div><a class="btn sm" href="/export/orders.csv">Export all orders (CSV)</a></div>
  <div class="chips">${days.map(k=>chip('day',k,k===day,esc(dayLabel(k)))).join('')}</div>
  <div class="summary"><div><b>${money(rev)}</b><span>taken</span></div><div><b>${live.length}</b><span>orders</span></div><div><b>${live.length?money(rev/live.length):'—'}</b><span>average order</span></div><div><b>${sold}</b><span>items sold</span></div></div>
  <div class="cols"><div class="card"><h3>Orders</h3>
   ${list.length?`<div class="olist">${list.map(o=>`<button class="orow${o.status==='void'?' void':''}" data-act="order" data-id="${esc(o.id)}"><span class="no">${o.no}</span>
     <span class="what"><div>${esc(o.items.map(i=>`${i.qty} ${i.en||i.fa}`).join(', '))}</div><small>${hm(o.at)}${o.table?`, ${esc(o.table)}`:''}${o.status==='void'?', voided':''}</small></span><span class="tot">${n0(o.total)}</span></button>`).join('')}</div>`
     :`<div style="margin-top:12px">${empty('No orders on this day','Orders you complete on the Sell tab show up here, with their receipts.')}</div>`}</div>
   <div style="display:grid;gap:18px"><div class="card"><h3>Money taken by hour</h3>
     <div class="hours" style="--n:${hours.length}">${hours.map(h=>`<div title="${h}:00, ${money(hrs[h]||0)}"><i class="${hrs[h]?'':'zero'}" style="height:${(hrs[h]||0)/hmx*100}%"></i><small>${h}</small></div>`).join('')}</div></div>
    <div class="card"><h3>Best sellers</h3>${top.length?`<div class="best">${top.map(t=>`<div class="r"><span>${esc(t.en)}</span><span class="muted num">${t.q} sold, ${n0(t.a)}</span><div class="bar"><i style="width:${Math.max(4,t.q/mx*100)}%;background:${esc(t.c)}"></i></div></div>`).join('')}</div>`:'<p class="muted" style="margin-top:6px">Nothing sold yet.</p>'}</div></div></div>`};
async function fetchDay(day){try{const r=await fetch('/api/orders?day='+encodeURIComponent(day));const j=await r.json();S.dayCache[day]=j.orders||[];render()}catch(_){toast("Couldn't load that day.",'bad')}}

/* MENU */
V.menu=()=>{
  const check=D.menu.filter(m=>m.verify).length;
  let h=`<div class="head"><div><h1>Menu and recipes</h1><p class="sub">${D.menu.length} items. A recipe tells the app what each sale takes out of stock.</p></div><button class="btn go" data-act="newItem">Add item</button></div>`;
  if(check)h+=`<div class="note"><p><b>${check} item${check>1?'s':''} came from the handwritten hot drinks board,</b> which was hard to read in the photo. Open each one marked Check and correct its name and price.</p></div>`;
  for(const c of allCats()){const its=sortItems(D.menu.filter(m=>m.cat===c.key));if(!its.length)continue;
    h+=`<section class="band"><div class="band-h"><span class="fa" lang="fa">${esc(c.fa||c.en)}</span><span>${esc(c.en)}</span></div><div class="list">${its.map(m=>{const cm=canMake(m);
      return `<button class="mi${m.active?'':' off'}" style="--c:${esc(m.color)}" data-act="editItem" data-id="${esc(m.id)}"><span class="sw">${art(m)}</span>
      <span class="nm"><span class="fa" lang="fa">${esc(m.fa)}</span><small>${esc(m.en)}</small></span><span class="pr">${money(m.price)}</span>
      <span class="meta">${m.recipe.length?`${m.recipe.length} ingredient${m.recipe.length>1?'s':''}`:'<span class="pill mute">No recipe</span>'}${cm!==null?(cm===0?' <span class="pill bad">Can’t make now</span>':`, enough for ${cm}`):''}${m.verify?' <span class="pill info">Check</span>':''}${m.active?'':' <span class="pill mute">Hidden from Sell</span>'}</span></button>`}).join('')}</div></section>`}
  return h};

/* STOCK */
V.stock=()=>{
  const lo=D.ingredients.filter(i=>state(i)!=='ok').length;
  const q=S.stockQ.trim().toLowerCase();
  let list=sortIngs(D.ingredients).filter(i=>!q||i.name.toLowerCase().includes(q));
  if(S.stockF==='need')list=list.filter(i=>state(i)!=='ok');
  const val=D.ingredients.reduce((s,i)=>s+i.qty*(i.cost||0),0);
  let h=`<div class="head"><div><h1>Stock</h1><p class="sub">${D.ingredients.length} ingredients${val?`, worth about ${money(val)}`:''}</p></div><button class="btn go" data-act="newIng">Add ingredient</button></div>`;
  if(D.sample_stock)h+=`<div class="note warn"><p><b>These amounts are examples.</b> Count what's on your shelves and set each one, so sales take the right amounts out.</p><button class="btn sm" data-act="sampleDone">I've counted everything</button></div>`;
  h+=`<div class="tools"><input id="s-q" data-bind="stockQ" placeholder="Find an ingredient" value="${esc(S.stockQ)}" autocomplete="off">${chip('sf','all',S.stockF==='all','All')}${chip('sf','need',S.stockF==='need',`Low or out (${lo})`)}</div>`;
  if(!D.ingredients.length)return h+empty('No ingredients yet','Add milk, fruit, syrups and the rest, then link them to menu items.');
  if(!list.length)return h+empty('Nothing matches','Try a different word.');
  return h+`<div class="list">${list.map(i=>{const s=state(i);const full=Math.max(i.min*3,i.qty,1);
    return `<div class="sr"><div class="nm"><b>${esc(i.name)}</b><small>Reorder at ${qn(i.min)} ${esc(i.unit)}${i.supplier?`, from ${esc(i.supplier)}`:''}</small></div>
    <div class="q"><b>${qn(i.qty)}</b><small>${esc(i.unit)}</small><div>${s==='out'?'<span class="pill bad">Out</span>':s==='low'?'<span class="pill warn">Low</span>':'<span class="pill ok">Fine</span>'}</div></div>
    <div class="acts"><div class="sstep"><button data-act="idec" data-id="${esc(i.id)}" aria-label="Take ${step(i.unit)} ${esc(i.unit)} out">−</button><span>${step(i.unit)}</span><button data-act="iinc" data-id="${esc(i.id)}" aria-label="Add ${step(i.unit)} ${esc(i.unit)}">+</button></div>
    <button class="btn sm" data-act="editIng" data-id="${esc(i.id)}">Count or edit</button></div>
    <div class="gauge ${s}"><i style="width:${Math.min(100,i.qty/full*100)}%"></i><u style="left:${i.min/full*100}%"></u></div></div>`}).join('')}</div>`};

/* BUY */
V.buy=()=>{
  const low=sortIngs(lowIngs());
  const list=D.shopping.slice().sort((a,b)=>(a.done-b.done)||(a.at-b.at));

   ${low.length?`<div class="list">${low.map(i=>`<div class="low"><div><b>${esc(i.name)}</b><br><small class="muted">Have ${qn(i.qty)} ${esc(i.unit)}, reorder at ${qn(i.min)}</small></div>
     <input id="b-${esc(i.id)}" type="number" inputmode="decimal" min="0" step="any" value="${sugg(i)}" aria-label="Amount of ${esc(i.name)} in ${esc(i.unit)}">
     <div class="b"><button class="btn sm go" data-act="recv" data-id="${esc(i.id)}">Received</button><button class="btn sm" data-act="lowToList" data-id="${esc(i.id)}">Add to list</button></div></div>`).join('')}</div>`

    ${list.length?`<div class="list">${list.map(s=>`<div class="lr${s.done?' done':''}"><input type="checkbox" data-act="shToggle" data-id="${esc(s.id)}" ${s.done?'checked':''} aria-label="Bought ${esc(s.text)}">
      <div class="t"><span>${esc(s.text)}${s.qty?`, ${qn(s.qty)} ${esc(s.unit)}`:''}</span>${s.ing?`<small>${s.done?'Added to stock':'Goes into stock when ticked'}</small>`:''}</div>

/* MAKE */
V.make=()=>{
  const items=sortItems(D.menu.filter(m=>m.active));
  const need={};S.plan.forEach(p=>{const m=item(p.id);(m?.recipe||[]).forEach(l=>need[l.ing]=r3((need[l.ing]||0)+l.qty*p.qty))});
  const rows=Object.entries(need).map(([id,q])=>{const i=ing(id)||{name:'Removed ingredient',unit:'',qty:0};return{i,q,short:r3(Math.max(0,q-i.qty))}}).sort((a,b)=>b.short-a.short||a.i.name.localeCompare(b.i.name));
  const shorts=rows.filter(r=>r.short>0).length;
  const prep=D.prep.slice().sort((a,b)=>(a.done-b.done)||(a.at-b.at));
  return `<div class="head"><div><h1>Make</h1><p class="sub">Plan a batch and keep the day's prep list.</p></div></div>
  <div class="grid2"><div class="card"><h3>Can we make it?</h3><p class="hint">Pick items and how many. You'll see what that needs next to what's in stock.</p>
   <div class="add"><select id="p-item" aria-label="Item"><option value="">Choose an item</option>${items.map(m=>`<option value="${esc(m.id)}">${esc(m.en)}  ${esc(m.fa)}</option>`).join('')}</select>
   <input id="p-qty" type="number" inputmode="numeric" min="1" value="10" aria-label="How many"><button class="btn sm go" data-act="planAdd">Add</button></div>
   ${S.plan.length?`<div class="chips" style="flex-wrap:wrap">${S.plan.map((p,ix)=>`<button class="chip" data-act="planRm" data-id="${ix}" aria-label="Remove ${esc(item(p.id)?.en||'')}">${p.qty} ${esc(item(p.id)?.en||'?')} ×</button>`).join('')}</div>
    ${rows.length?`<div class="scroll-x"><table class="need"><thead><tr><th>Ingredient</th><th class="n">Needs</th><th class="n">In stock</th><th class="n">Short by</th></tr></thead><tbody>
     ${rows.map(r=>`<tr class="${r.short>0?'short':''}"><td>${esc(r.i.name)}</td><td class="n">${qn(r.q)} ${esc(r.i.unit)}</td><td class="n">${qn(r.i.qty)}</td><td class="n">${r.short>0?qn(r.short):'—'}</td></tr>`).join('')}</tbody></table></div>`
     :'<p class="muted" style="margin-top:10px">These items have no recipe yet. Add one on the Menu tab.</p>'}
    <div class="actions" style="margin-top:14px">${shorts?`<button class="btn go" data-act="planToList">Add ${shorts} missing to the shopping list</button>`:rows.length?'<span class="pill ok" style="align-self:center;padding:6px 12px">You have enough of everything</span>':''}<button class="btn quiet" data-act="planClear">Clear plan</button></div>`
   :'<p class="muted">No items in the plan yet.</p>'}</div>
  <div class="card"><h3>Prep list</h3><p class="hint">Jobs to get done before or during service.</p>
   <div class="add" style="grid-template-columns:minmax(0,1fr) auto"><input id="pr-text" placeholder="Slice 2 kg strawberries" aria-label="Prep job"><button class="btn sm go" data-act="prAdd" style="grid-column:auto">Add</button></div>
   ${prep.length?`<div class="list">${prep.map(p=>`<div class="lr${p.done?' done':''}"><input type="checkbox" data-act="prToggle" data-id="${esc(p.id)}" ${p.done?'checked':''} aria-label="Done: ${esc(p.text)}"><div class="t"><span>${esc(p.text)}</span></div><button class="x" data-act="prDel" data-id="${esc(p.id)}" aria-label="Remove">×</button></div>`).join('')}</div>
    ${prep.some(p=>p.done)?'<div style="margin-top:12px"><button class="btn sm quiet" data-act="prClear">Clear finished jobs</button></div>':''}`
   :empty('Nothing to prep','Add jobs like making batter, cutting fruit or squeezing lemons.')}</div></div>`};

const findOrder=id=>D.orders.find(o=>o.id===id)||Object.values(S.dayCache).flat().find(o=>o.id===id)||(S.last&&S.last.id===id?S.last:null);

function receiptText(o){const s=D.settings;const L=[s.name.toUpperCase(),`${s.fa} · ${s.tagline}`,`${s.phone} · ${s.insta}`,'--------------------------------',`Order #${o.no}${o.table?'  '+o.table:''}`,`${longDate(o.day)} ${hm(o.at)}`];

  <label class="f">Cost per unit (${esc(cur())})<input id="g-cost" type="number" step="any" min="0" inputmode="decimal" value="${esc(e.cost??'')}" placeholder="Optional"></label></div>
  <label class="f">Supplier<input id="g-sup" value="${esc(e.supplier)}" placeholder="Optional"></label>
  ${used.length?`<p class="hint">Used in ${used.map(m=>esc(m.en)).join(', ')}.</p>`:e.isNew?'':'<p class="hint">Not used in any recipe yet.</p>'}</div>
  <div class="actions"><button class="btn go" data-act="saveIng">Save ingredient</button>${e.isNew?'':'<button class="btn danger quiet" data-act="delIng">Delete ingredient</button>'}</div>`}
function settingsSheet(){const s=D.settings;const th=(()=>{try{return localStorage.getItem('senso-theme')||'auto'}catch(_){return 'auto'}})();
  return `<div class="sh"><h2>Shop and receipts</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="form"><div class="two"><label class="f">Shop name<input id="t-name" value="${esc(s.name)}"></label><label class="f">Name in Dari<input id="t-fa" dir="rtl" value="${esc(s.fa)}"></label></div>
  <div class="two"><label class="f">Phone<input id="t-phone" value="${esc(s.phone)}"></label><label class="f">Instagram<input id="t-insta" value="${esc(s.insta)}"></label></div>
  <label class="f">Tagline<input id="t-tag" dir="rtl" value="${esc(s.tagline)}"></label>
  <label class="f">Receipt footer<input id="t-foot" value="${esc(s.footer)}"></label>
  <div class="two"><label class="f">Receipt paper<select id="t-paper"><option value="80" ${s.paper==80?'selected':''}>80 mm</option><option value="58" ${s.paper==58?'selected':''}>58 mm</option></select></label>
  <label class="f">Currency sign<input id="t-cur" value="${esc(s.currency)}"></label></div>
  <div class="two"><label class="f">Time zone (minutes from UTC)<input id="t-off" type="number" value="${esc(s.utc_offset_min)}"></label>
  <label class="f">Look<select id="t-theme"><option value="auto" ${th==='auto'?'selected':''}>Match this device</option><option value="dark" ${th==='dark'?'selected':''}>Dark</option><option value="light" ${th==='light'?'selected':''}>Light</option></select></label></div>
  <p class="hint">Kabul is 270 (UTC+4:30). Download a <a href="/export/backup.json" style="color:inherit">backup of all data</a> now and then.</p></div>
  <div class="actions"><button class="btn go" data-act="saveSettings">Save settings</button></div>`}

/* actions */
function armed(t,fn){if(t.dataset.armed){fn();return}t.dataset.armed='1';const o=t.textContent;t.textContent='Press again to confirm';t.classList.add('armed');setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent=o;t.classList.remove('armed')}},3000)}
async function copy(text,ok){try{await navigator.clipboard.writeText(text);toast(ok)}catch(_){openSheet('copy',`<div class="sh"><h2>Copy this text</h2><button class="x" data-act="close" aria-label="Close">×</button></div><textarea id="copybox" rows="14" readonly>${esc(text)}</textarea>`,'Copy');const b=$('#copybox');b.focus();b.select()}}
function applyTheme(t){const r=document.documentElement;if(t==='dark'||t==='light')r.dataset.theme=t;else delete r.dataset.theme;try{t==='auto'?localStorage.removeItem('senso-theme'):localStorage.setItem('senso-theme',t)}catch(_){}}
const A={
  reload:()=>load(),
  tab:id=>{location.hash=id},
  cat:id=>{S.cat=id;render()},
  add:id=>{const c=S.cart.find(x=>x.id===id);c?c.qty++:S.cart.push({id,qty:1});render()},
  inc:id=>{const c=S.cart.find(x=>x.id===id);if(c)c.qty++;render()},
  dec:id=>{const c=S.cart.find(x=>x.id===id);if(!c)return;if(--c.qty<=0)S.cart=S.cart.filter(x=>x!==c);render()},
  clearcart:(id,t)=>armed(t,()=>{S.cart=[];S.order={table:'',note:'',discount:''};render()}),
  openTicket:()=>{openSheet('ticket',`<div class="sh"><h2>Order</h2><button class="x" data-act="close" aria-label="Close">×</button></div>${ticket()}`,'Order','paper');$('#sheet .sheet').classList.add('ticket')},
  close:()=>closeSheet(),
  theme:()=>{const dark=matchMedia('(prefers-color-scheme: dark)').matches;const now=document.documentElement.dataset.theme||(dark?'dark':'light');applyTheme(now==='dark'?'light':'dark')},
  checkout:async(id,t)=>{if(!S.cart.length||t.disabled)return;t.disabled=true;
    const j=await act(api('POST','/api/orders',{items:S.cart,table:S.order.table,note:S.order.note,discount:+S.order.discount||0}));
    if(!j){t.disabled=false;return}
    S.last=j.order;S.cart=[];S.order={table:'',note:'',discount:''};if(S.sheet)closeSheet();render();openReceipt(j.order,true)},
  order:id=>{const o=findOrder(id);if(o)openReceipt(o,false)},
  print:id=>{const w=window.open('/receipt/'+encodeURIComponent(id)+'?print=1','_blank');if(!w)location.href='/receipt/'+encodeURIComponent(id)+'?print=1'},
  copyReceipt:id=>{const o=findOrder(id);if(o)copy(receiptText(o),'Receipt copied')},
  voidOrder:(id,t)=>armed(t,async()=>{const j=await act(api('POST',`/api/orders/${id}/void`),'Order voided. Its ingredients went back into stock.');if(j)closeSheet()}),
  day:id=>{S.day=id;render()},
  newItem:()=>{S.edit={isNew:true,fa:'',en:'',cat:S.cat!=='all'?S.cat:'shakes',price:'',color:'#C9A27E',active:true,verify:false,recipe:[]};openSheet('item',itemSheet(),'Menu item')},
  editItem:id=>{const m=item(id);if(!m)return;S.edit={...m,recipe:m.recipe.map(l=>({...l}))};openSheet('item',itemSheet(),'Menu item')},
  addLine:()=>{syncEdit();S.edit.recipe.push({ing:'',qty:''});$('#e-recipe').innerHTML=recipeRows()},
  rmLine:ix=>{syncEdit();S.edit.recipe.splice(+ix,1);$('#e-recipe').innerHTML=recipeRows()},
  saveItem:async()=>{syncEdit();const e=S.edit;const cat=e.cat==='__new'?e.catnew.trim():e.cat;
    const body={fa:e.fa,en:e.en,cat,price:e.price===''?null:+e.price,color:e.color,active:e.active,verify:e.verify,ord:e.ord??99,recipe:e.recipe.filter(l=>l.ing&&+l.qty>0).map(l=>({ing:l.ing,qty:+l.qty}))};
    const j=await act(e.isNew?api('POST','/api/menu',body):api('PUT','/api/menu/'+e.id,body),'Item saved');if(j)closeSheet()},
  delItem:(id,t)=>armed(t,async()=>{const eid=S.edit.id;if(await act(api('DELETE','/api/menu/'+eid),'Item deleted')){S.cart=S.cart.filter(c=>c.id!==eid);closeSheet()}}),
  iinc:id=>{const i=ing(id);if(i)act(api('POST',`/api/ingredients/${id}/adjust`,{delta:step(i.unit)}))},
  idec:id=>{const i=ing(id);if(i)act(api('POST',`/api/ingredients/${id}/adjust`,{delta:-step(i.unit)}))},
  newIng:()=>{S.edit={isNew:true,name:'',qty:'',unit:'kg',min:'',cost:null,supplier:''};openSheet('ing',ingSheet(),'Ingredient')},
  editIng:id=>{const i=ing(id);if(!i)return;S.edit={...i};openSheet('ing',ingSheet(),'Ingredient')},
  saveIng:async()=>{const v=id=>document.getElementById(id).value;
    const body={name:v('g-name'),qty:+v('g-qty')||0,unit:v('g-unit'),min:+v('g-min')||0,cost:v('g-cost')===''?null:+v('g-cost'),supplier:v('g-sup')};
    const j=await act(S.edit.isNew?api('POST','/api/ingredients',body):api('PUT','/api/ingredients/'+S.edit.id,body),'Ingredient saved');if(j)closeSheet()},
  delIng:(id,t)=>armed(t,async()=>{if(await act(api('DELETE','/api/ingredients/'+S.edit.id),'Ingredient deleted'))closeSheet()}),
  sf:id=>{S.stockF=id;render()},
  sampleDone:()=>act(api('PUT','/api/settings',{sample_stock:false}),'Thanks. Stock counts are set.'),
  recv:id=>{const i=ing(id);const q=+document.getElementById('b-'+id)?.value;if(!(q>0)){toast('Enter how much you bought.','bad');return}act(api('POST',`/api/ingredients/${id}/adjust`,{delta:q}),`Added ${qn(q)} ${i.unit} of ${i.name} to stock`)},
  lowToList:id=>{const i=ing(id);const q=+document.getElementById('b-'+id)?.value||sugg(i);act(api('POST','/api/shopping',{text:i.name,qty:q,ing:id}),`${i.name} is on the list`)},
  shAdd:async()=>{const t=$('#sh-text').value.trim();if(!t){$('#sh-text').focus();return}const q=$('#sh-qty').value.trim();
    const m=D.ingredients.find(g=>g.name.toLowerCase()===t.toLowerCase());
    if(await act(api('POST','/api/shopping',{text:t,qty:+q||0,unit:m?m.unit:'',ing:m?m.id:''}))){$('#sh-text').value='';$('#sh-qty').value='';$('#sh-text').focus()}},
  shToggle:id=>act(api('POST',`/api/shopping/${id}/toggle`)),
  shDel:id=>act(api('DELETE','/api/shopping/'+id)),
  shClear:(id,t)=>armed(t,()=>act(api('POST','/api/shopping/clear'),'Cleared')),
  copyList:()=>{const L=[`Shopping list for ${D.settings.name}, ${longDate(D.today)}`,''];const listed=new Set(D.shopping.filter(s=>!s.done&&s.ing).map(s=>s.ing));
    D.shopping.filter(s=>!s.done).forEach(s=>L.push(`- ${s.text}${s.qty?`: ${qn(s.qty)} ${s.unit}`:''}`));
    lowIngs().filter(i=>!listed.has(i.id)).forEach(i=>L.push(`- ${i.name}: ${qn(sugg(i))} ${i.unit}`));
    if(L.length===2){toast('Nothing to buy right now');return}copy(L.join('\n'),'Shopping list copied')},
  planAdd:()=>{const id=$('#p-item').value,q=Math.max(1,parseInt($('#p-qty').value)||0);if(!id){toast('Choose an item first.','bad');return}const p=S.plan.find(x=>x.id===id);p?p.qty+=q:S.plan.push({id,qty:q});render()},
  planRm:ix=>{S.plan.splice(+ix,1);render()},
  planClear:()=>{S.plan=[];render()},
  planToList:async()=>{const need={};S.plan.forEach(p=>(item(p.id)?.recipe||[]).forEach(l=>need[l.ing]=(need[l.ing]||0)+l.qty*p.qty));let n=0;
    for(const[id,q]of Object.entries(need)){const i=ing(id);if(!i)continue;const s=r3(q-i.qty);if(s<=0)continue;const st=step(i.unit);
      if(await act(api('POST','/api/shopping',{text:i.name,qty:Math.ceil(s/st)*st,ing:id})))n++}
    toast(`${n} item${n===1?'':'s'} added to the shopping list`)},
  prAdd:async()=>{const t=$('#pr-text').value.trim();if(!t){$('#pr-text').focus();return}if(await act(api('POST','/api/prep',{text:t}))){const e=$('#pr-text');if(e){e.value='';e.focus()}}},
  prToggle:id=>act(api('POST',`/api/prep/${id}/toggle`)),
  prDel:id=>act(api('DELETE','/api/prep/'+id)),
  prClear:(id,t)=>armed(t,()=>act(api('POST','/api/prep/clear'),'Cleared')),
  settings:()=>openSheet('settings',settingsSheet(),'Settings'),
  saveSettings:async()=>{const v=id=>document.getElementById(id).value;applyTheme(v('t-theme'));
    const j=await act(api('PUT','/api/settings',{name:v('t-name'),fa:v('t-fa'),phone:v('t-phone'),insta:v('t-insta'),tagline:v('t-tag'),footer:v('t-foot'),paper:+v('t-paper'),currency:v('t-cur'),utc_offset_min:+v('t-off')}),'Settings saved');if(j)closeSheet()}
};
const BIND={table:t=>S.order.table=t.value,note:t=>S.order.note=t.value,
  discount:t=>{S.order.discount=t.value;const tt=totals();document.querySelectorAll('.tk-tot .grand .num,.charge .num').forEach(e=>e.textContent=money(tt.total));$('#ob-t').textContent=money(tt.total)},
  q:t=>{S.q=t.value;render()},stockQ:t=>{S.stockQ=t.value;render()}};
const CHANGE={eCat:t=>{$('#e-catnew-w').hidden=t.value!=='__new'},rIng:t=>{const u=document.getElementById('r-u-'+t.dataset.id);if(u)u.textContent=ing(t.value)?.unit||''}};
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  if(!(t.tagName==='INPUT'&&t.type==='checkbox'))e.preventDefault();
  const f=A[t.dataset.act];if(f&&(D||t.dataset.act==='reload'))f(t.dataset.id,t,e)});
document.addEventListener('input',e=>{const b=e.target.dataset?.bind;if(b&&BIND[b])BIND[b](e.target)});
document.addEventListener('change',e=>{const c=e.target.dataset?.change;if(c&&CHANGE[c])CHANGE[c](e.target)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.sheet)closeSheet();
  if(e.key!=='Enter')return;
  if(e.target.matches('#sh-text,#sh-qty'))A.shAdd();
  else if(e.target.matches('#pr-text'))A.prAdd();
  else if(e.target.matches('#p-qty'))A.planAdd();
  else if(e.target.matches('#find')){const first=document.querySelector('.tile');if(first)first.click()}});
function route(){const h=location.hash.slice(1);S.tab=NAV.some(n=>n[0]===h)?h:'sell';if(S.sheet==='ticket')closeSheet();render();scrollTo(0,0)}
addEventListener('hashchange',route);
try{const t=localStorage.getItem('senso-theme');if(t)document.documentElement.dataset.theme=t}catch(_){}
route();load();
})();
</script>
</body>
</html>
