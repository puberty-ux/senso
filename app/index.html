<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A1714">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data: blob:; style-src 'self' file: 'unsafe-inline'; font-src 'self' file: data:; script-src 'self' file:; connect-src 'self' file:">
<title>Senso Bar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<aside class="rail" id="rail">
  <div class="mark" aria-hidden="true">س</div>
  <nav class="nav" id="nav"></nav>
  <div class="spacer"></div>
  <div class="rail-extra">
    <button class="icon-btn" data-act="lang" id="lang-btn" aria-label="English / دری" style="font-weight:800;font-size:14px"></button>
    <button class="icon-btn" data-act="theme" id="theme-btn" aria-label="Light or dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</aside>
<div class="app">
  <div class="mobile-top"><div class="mark" aria-hidden="true">س</div><b id="mname">Senso Bar</b>
    <button class="icon-btn" data-act="lang" id="lang-btn-m" aria-label="English / دری" style="font-weight:800;font-size:13px"></button>
    <button class="icon-btn" data-act="theme" aria-label="Light or dark" style="margin-inline-start:0"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
  <main class="page" id="main"><div class="splash"><div><div class="mark">س</div><p class="muted">Senso Bar</p></div></div></main>
</div>
<div id="orderbar" hidden><button data-act="openTicket"><span id="ob-n"></span><span class="num" id="ob-t"></span><span class="go" id="ob-go"></span></button></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>
<div id="print-area"></div>
<script src="js/core.js"></script>
<script src="js/seed.js"></script>
<script src="js/i18n.js"></script>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
</body>
</html>
